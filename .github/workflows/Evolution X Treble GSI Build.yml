

on:
  workflow_dispatch:
    inputs:
      EVO_BRANCH:
        description: 'Evolution X manifest branch'
        required: true
        default: 'udc' # Example branch for Android U/14

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 1. تنظیمات محیط
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y python python3-pip make zip xz-utils rsync gnupg build-essential ccache curl
        # افزایش فضای دیسک (برای GSI Build ضروری است)
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384  # 16GB
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    # 2. آماده سازی Repo
    - name: Install Repo
      run: |
        mkdir -p ~/bin
        PATH=~/bin:$PATH
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    # 3. ایجاد و همگام سازی دایرکتوری بیلد
    - name: Initialize and Sync Manifest
      run: |
        mkdir -p evo
        cd evo
        
        # الف. Repo Init
        repo init --depth=1 -u https://github.com/Evolution-X/manifest -b ${{ github.event.inputs.EVO_BRANCH }}
        
        # ب. کلون کردن مانیفست محلی (Treble Manifest)
        # ⚠️ توجه: این بخش ممکن است باعث خطای 'duplicate path' شما شود.
        # من اینجا از یک مثال رایج استفاده می‌کنم.
        git clone https://github.com/mytja/treble_manifest.git -b evo-${{ github.event.inputs.EVO_BRANCH }} .repo/local_manifests
        
        # ج. اجرای Sync (خطایی که گزارش کردید اینجا رخ می‌دهد)
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)
        
    # 4. رفع خطای 'duplicate path' (اقدام فرضی)
    # اگر مانیفست محلی شما واقعاً باعث تکرار 'build/blueprint' شده باشد،
    # ممکن است نیاز باشد این ماژول را حذف کنید:
    #- name: Remove Duplicate Project (Hypothetical Fix)
    #  run: |
    #    cd evo/.repo/local_manifests
    #    # این یک دستور فرضی است. شما باید XML را ویرایش کنید.
    #    # sed -i '/<project path="build\/blueprint"/d' your_local_manifest.xml
    #    # یا اگر پروژه مورد نظر شما در مانیفست محلی بود، فایل را ویرایش کنید.

    # 5. اعمال پچ‌ها و آماده‌سازی Treble
    - name: Apply Patches and Setup Treble
      run: |
        cd evo
        # اعمال پچ‌های TrebleDroid و محلی
        ./patches/apply-all.sh
        
        # تولید فایل make برای GSI
        cd device/phh/treble
        bash generate.sh ../../mytja/evo/evo.mk
        
    # 6. ساخت Treble App
    - name: Build Treble App
      run: |
        cd evo/treble_app
        ./build.sh release
        
    # 7. کامپایل GSI
    - name: Compilation
      run: |
        cd evo
        source build/envsetup.sh
        ccache -M 50G -F 0
        lunch treble_arm64_bgN-userdebug
        make systemimage -j$(nproc --all)
        
    # 8. فشرده سازی و آپلود
    - name: Compress and Upload Artifact
      run: |
        cd evo/out/target/product/tdgsi_arm64_ab
        xz -9 -T0 -v -z system.img
        
        # آپلود خروجی نهایی به عنوان Artifact
        echo "LATEST_GSI_FILE=$(ls *.xz)" >> $GITHUB_ENV
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Evolution-X-Treble-GSI
        path: evo/out/target/product/tdgsi_arm64_ab/${{ env.LATEST_GSI_FILE }}
