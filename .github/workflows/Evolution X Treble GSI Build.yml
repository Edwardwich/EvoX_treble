name: Evolution X Treble GSI Build

on:
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      EVO_BRANCH:
        description: 'Evolution X manifest branch (e.g., bka for Android 16)'
        required: true
        default: 'bka'
      TREBLE_MANIFEST_BRANCH:
        description: 'Branch of the treble_manifest repository (e.g., bka)'
        required: true
        default: 'bka'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Set a maximum time limit for the job
    timeout-minutes: 360

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Build Environment & Install Dependencies
      run: |
        echo "Updating system and installing dependencies..."
        sudo apt update
        # Fix: Replace 'python' with the correct package 'python-is-python3'
        sudo apt install -y python-is-python3 python3-pip make zip xz-utils rsync gnupg build-essential ccache curl git bc bison flex libncurses5-dev libssl-dev texinfo gawk liblz4-tool
        
        # Increase disk space (Create 16GB Swap File, essential for AOSP/GSI builds)
        echo "Setting up 16GB swap file..."
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
    - name: Initialize, Sync Manifest, and Apply Fixes
      run: |
        # Fix: Install Repo and set PATH within the same run step
        echo "Installing and configuring repo tool..."
        mkdir -p ~/bin
        export PATH=~/bin:$PATH
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        
        # Create build directory and initialize
        mkdir -p evo
        cd evo
        
        # 1. Repo Init: Initialize the Evolution X main manifest
        echo "Initializing Evolution X manifest..."
        repo init --depth=1 -u https://github.com/Evolution-X/manifest -b ${{ github.event.inputs.EVO_BRANCH }}
        
        # 2. Clone Local Manifest (This is a common source of the 'duplicate path' error)
        echo "Cloning local treble manifest..."
        git clone https://github.com/Evolution-X/treble_manifest.git -b ${{ github.event.inputs.TREBLE_MANIFEST_BRANCH }} .repo/local_manifests
        
        # 3. HYPOTHETICAL FIX: Remove the line causing 'duplicate path build/blueprint'
        # This command deletes any line containing 'platform/build/blueprint' from local XML files.
        echo "Applying hypothetical fix for 'duplicate path build/blueprint'..."
        sed -i '/platform\/build\/blueprint/d' .repo/local_manifests/*.xml
        
        # 4. Run Sync: Download the source code
        echo "Starting repo sync..."
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)
        
    - name: Apply Patches and Setup Treble
      run: |
        cd evo
        # Apply TrebleDroid and local patches (if the patches directory exists)
        if [ -d "./patches" ]; then
          echo "Applying patches..."
          ./patches/apply-all.sh
        fi
        
        # Generate the required makefile for the GSI build
        echo "Generating Treble makefile..."
        cd device/phh/treble
        bash generate.sh ../../mytja/evo/evo.mk
        
    - name: Build Treble App
      run: |
        echo "Building Treble App..."
        cd evo/treble_app
        ./build.sh release
        
    - name: Compilation
      run: |
        echo "Starting GSI compilation..."
        cd evo
        source build/envsetup.sh
        # Set up Ccache for faster subsequent builds (if using a persistent runner, though less effective on GitHub Actions)
        ccache -M 50G -F 0
        # Lunch command for A/B, GApps, V-A, Non-root build type
        lunch treble_arm64_bgN-userdebug
        make systemimage -j$(nproc --all)
        
    - name: Compress GSI Image
      run: |
        echo "Compressing system image with xz..."
        cd evo/out/target/product/tdgsi_arm64_ab
        xz -9 -T0 -v -z system.img
        
        # Save the final compressed file name to an environment variable
        echo "LATEST_GSI_FILE=$(ls *.xz)" >> $GITHUB_ENV
        
    - name: Upload GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Evolution-X-Treble-GSI
        path: evo/out/target/product/tdgsi_arm64_ab/${{ env.LATEST_GSI_FILE }}
