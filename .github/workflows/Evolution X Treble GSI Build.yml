name: Evolution X Treble GSI Build (Without External Manifest)

on:
  workflow_dispatch:
    inputs:
      EVO_BRANCH:
        description: 'Evolution X manifest branch (e.g., bka for your specific build)'
        required: true
        default: 'bka'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Repo Tool
      run: |
        echo "Installing repo tool and adding to PATH..."
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Setup Build Environment & Install Dependencies
      run: |
        echo "Updating system and installing dependencies..."
        sudo apt update
        sudo apt install -y python-is-python3 python3-pip make zip xz-utils rsync gnupg build-essential ccache curl git bc bison flex libncurses5-dev libssl-dev texinfo gawk liblz4-tool
        
        echo "Setting up 16GB swap file..."
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
    - name: Initialize and Sync Evolution X Manifest
      run: |
        mkdir -p evo
        cd evo
        
        # 1. Repo Init: Initialize the Evolution X main manifest
        echo "Initializing Evolution X manifest..."
        repo init --depth=1 -u https://github.com/Evolution-X/manifest -b ${{ github.event.inputs.EVO_BRANCH }}
        
        # 2. Run Sync: Download the source code
        echo "Starting repo sync..."
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)
        
    - name: Apply Patches and Setup Treble
      run: |
        cd evo
        
        # ⚠️ توجه: اگر از مانیفست محلی استفاده نمی‌کنید، باید سورس TrebleDroid را اضافه کنید.
        # فرض می‌کنیم شما پچ‌ها و ماژول device/mytja/evo/ را به صورت دستی اضافه یا حذف کرده‌اید.
        
        # اگر پچ‌ها در مسیر استاندارد TrebleDroid باشند:
        if [ -d "./patches" ]; then
          echo "Applying patches..."
          ./patches/apply-all.sh
        fi
        
        # ⚠️ توجه: این مسیر makefile (../../mytja/evo/evo.mk) ممکن است دیگر وجود نداشته باشد.
        # اگر این خط خطا داد، باید آن را به مسیر makefile GSI مورد نظر خود تغییر دهید.
        echo "Generating Treble makefile..."
        cd device/phh/treble
        bash generate.sh ../../mytja/evo/evo.mk
        
    - name: Build Treble App
      run: |
        echo "Building Treble App..."
        cd evo/treble_app
        ./build.sh release
        
    - name: Compilation
      run: |
        echo "Starting GSI compilation..."
        cd evo
        source build/envsetup.sh
        ccache -M 50G -F 0
        lunch treble_arm64_bgN-userdebug
        make systemimage -j$(nproc --all)
        
    - name: Compress GSI Image
      run: |
        echo "Compressing system image with xz..."
        cd evo/out/target/product/tdgsi_arm64_ab
        xz -9 -T0 -v -z system.img
        
        echo "LATEST_GSI_FILE=$(ls *.xz)" >> $GITHUB_ENV
        
    - name: Upload GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Evolution-X-Treble-GSI
        path: evo/out/target/product/tdgsi_arm64_ab/${{ env.LATEST_GSI_FILE }}
