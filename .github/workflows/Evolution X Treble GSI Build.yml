

on:
  # این امکان را می‌دهد که به صورت دستی از تب Actions اجرا شود
  workflow_dispatch:
    inputs:
      EVO_BRANCH:
        description: 'Evolution X manifest branch (e.g., udc for Android 14)'
        required: true
        default: 'udc'
      TREBLE_MANIFEST_BRANCH:
        description: 'Branch of the treble_manifest repository (e.g., evo-udc)'
        required: true
        default: 'evo-udc'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # تنظیم زمان تایم‌اوت در صورت طولانی شدن بیلد
    timeout-minutes: 360

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Build Environment & Install Dependencies
      run: |
        # به‌روزرسانی و نصب وابستگی‌های مورد نیاز
        sudo apt update
        # رفع خطای "Package 'python' has no installation candidate"
        sudo apt install -y python-is-python3 python3-pip make zip xz-utils rsync gnupg build-essential ccache curl git bc bison flex libncurses5-dev libssl-dev texinfo gawk liblz4-tool
        
        # افزایش فضای دیسک (ایجاد Swap File 16GB)
        echo "Setting up 16GB swap file..."
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
    - name: Install Repo
      run: |
        mkdir -p ~/bin
        PATH=~/bin:$PATH
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Initialize and Sync Manifest
      run: |
        mkdir -p evo
        cd evo
        
        # 1. Repo Init: شروع فرآیند بیلد با مانیفست اصلی Evolution X
        repo init --depth=1 -u https://github.com/Evolution-X/manifest -b ${{ github.event.inputs.EVO_BRANCH }}
        
        # 2. کلون کردن مانیفست محلی
        # این مانیفست فایل‌های XML را به .repo/local_manifests/ اضافه می‌کند.
        # فرض بر این است که از مخزن mytja/treble_manifest استفاده می‌شود.
        git clone https://github.com/mytja/treble_manifest.git -b ${{ github.event.inputs.TREBLE_MANIFEST_BRANCH }} .repo/local_manifests
        
        # 3. رفع خطای فرضی "duplicate path build/blueprint"
        # ⚠️ اگر مانیفست محلی شما (احتمالاً evo.xml یا treble.xml)
        # حاوی <project path="build/blueprint" ...> باشد، این خط آن را حذف می‌کند.
        echo "Attempting to fix duplicate path error by modifying local manifest..."
        sed -i '/platform\/build\/blueprint/d' .repo/local_manifests/*.xml
        
        # 4. اجرای Sync: دانلود کد منبع
        echo "Starting repo sync..."
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)
        
    - name: Apply Patches and Setup Treble
      run: |
        cd evo
        # اعمال پچ‌های TrebleDroid و محلی (اگر ./patches وجود داشته باشد)
        if [ -d "./patches" ]; then
          ./patches/apply-all.sh
        fi
        
        # تولید فایل make برای GSI
        cd device/phh/treble
        bash generate.sh ../../mytja/evo/evo.mk
        
    - name: Build Treble App
      run: |
        # ساخت Treble App
        cd evo/treble_app
        ./build.sh release
        
    - name: Compilation
      run: |
        # شروع بیلد نهایی GSI
        cd evo
        source build/envsetup.sh
        ccache -M 50G -F 0
        # تنظیمات lunch: treble_arm64_bgN-userdebug (A/B, GApps, V-A, Non-root)
        lunch treble_arm64_bgN-userdebug
        make systemimage -j$(nproc --all)
        
    - name: Compress GSI Image
      run: |
        # فشرده‌سازی ایمیج سیستم
        cd evo/out/target/product/tdgsi_arm64_ab
        xz -9 -T0 -v -z system.img
        
        # ذخیره نام فایل فشرده برای مرحله بعد
        echo "LATEST_GSI_FILE=$(ls *.xz)" >> $GITHUB_ENV
        
    - name: Upload GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Evolution-X-Treble-GSI
        path: evo/out/target/product/tdgsi_arm64_ab/${{ env.LATEST_GSI_FILE }}
